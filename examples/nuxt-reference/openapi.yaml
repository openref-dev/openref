openapi: 3.1.0
info:
  title: Parcels
  version: 1.4.0
  description: |
    A small parcel tracking API, used by the SPEC 16.4 example.

    It exists so the Nuxt module has a real document to mount: several operations,
    a schema with a reference in it, and one absolute server so the proxy of
    SPEC 16.2 has an upstream to pin.
servers:
  - url: https://api.parcels.example.com/v1
    description: Production
paths:
  /parcels:
    get:
      operationId: listParcels
      summary: List parcels
      tags: [Parcels]
      parameters:
        - name: status
          in: query
          description: Only parcels in this state.
          schema:
            type: string
            enum: [booked, in-transit, delivered]
      responses:
        '200':
          description: The parcels this account can see.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Parcel'
    post:
      operationId: bookParcel
      summary: Book a parcel
      tags: [Parcels]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParcelDraft'
      responses:
        '201':
          description: The parcel as it was booked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Parcel'
        '422':
          description: The draft could not be booked.
  /parcels/{id}:
    get:
      operationId: getParcel
      summary: Read one parcel
      tags: [Parcels]
      parameters:
        - name: id
          in: path
          required: true
          description: Identifier the booking returned.
          schema:
            type: string
      responses:
        '200':
          description: The parcel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Parcel'
        '404':
          description: No parcel of that identifier.
components:
  schemas:
    ParcelDraft:
      type: object
      required: [destination]
      properties:
        destination:
          $ref: '#/components/schemas/Address'
        note:
          type: string
          description: What the courier should know.
    Parcel:
      type: object
      required: [id, status, destination]
      properties:
        id:
          type: string
        status:
          type: string
          enum: [booked, in-transit, delivered]
        destination:
          $ref: '#/components/schemas/Address'
    Address:
      type: object
      required: [line1, city, country]
      properties:
        line1:
          type: string
        city:
          type: string
        country:
          type: string
          description: ISO 3166-1 alpha-2.
