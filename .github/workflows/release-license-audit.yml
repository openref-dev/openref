name: Release license audit

# The production zone of the license policy is the dependency closure of what is actually
# published. Running it in CI proves the workspace is clean; running it here proves the
# thing about to be published is clean, which is the claim that matters to a consumer.
#
# Callable, so the release job of T064 gates publication on it with `uses:` rather than
# reimplementing the check.

on:
  push:
    tags:
      - 'v*'
  workflow_call:
  workflow_dispatch:

jobs:
  licenses:
    name: published closure license audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: License audit
        run: pnpm run gates:licenses
