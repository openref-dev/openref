name: CI

# A GATE SUITE THAT WAITS FOR A MERGE PROTECTS NOTHING DURING THE WORK. This file ran on
# `push: [main]` and `pull_request` for six sessions, and every session's work happened on a
# branch that was neither, so not one gate ever executed here. Every branch, every push.
on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: install, lint, build, test, gates on Node ${{ matrix.node }}
    runs-on: ubuntu-latest

    # THE WALL, SET BY MEASUREMENT ON 2026-09-04 AND NOT BY A ROUND NUMBER.
    #
    # WHAT IT WAS AND WHY IT MOVED. It was 30, chosen by nobody in particular, and the same code ran
    # 21m32s, 28m13s and 28m55s against it, which is 6m41s of pure runner variance with 65 seconds
    # left over. A job that absorbed one 180,000 ms test timeout finished 65 seconds inside its own
    # wall, so a second timeout anywhere in the suite killed the job before any bound in it could
    # report. That made every declared bound in the whole suite capped in practice by what one job
    # could absorb rather than by what it declared.
    #
    # RE-MEASURED AFTER THE THREE FIXES, BECAUSE THEY CHANGE THE NUMBER, and measured on the runner
    # with the machine beside every reading. Six samples of one commit through the `wall` job of
    # `coverage-timeout-study.yml`, which runs this job step for step: 22m07s on an AMD EPYC 9V74,
    # 22m04s and 22m27s on an EPYC 7763 for Node 24; 24m57s and 25m23s on an EPYC 7763 and 16m18s on
    # an Intel Xeon 6973P-C for Node 22. Zero test timeouts in all six. The observed maximum is
    # 25m23s and the observed minimum is 16m18s, and the 9m05s between them is which processor the
    # pool handed out and not which Node version ran: the same Node 22 gives both ends.
    #
    # THE MARGIN THIS REPOSITORY USES FOR A BOUND CANNOT BE USED HERE AND THAT IS SAID RATHER THAN
    # QUIETLY SWAPPED. A test bound gets an order of magnitude over its measured maximum. Ten times
    # 25m23s is 4h13m50s. GitHub would accept it, since its own ceiling is six hours, and it would
    # mean a hung job burning four hours before anything said so, which is the one thing a wall
    # exists to prevent. So the doctrine is named, refused with its arithmetic, and a smaller margin
    # is chosen and defended.
    #
    # THE MARGIN USED IS 1.77 TIMES THE OBSERVED MAXIMUM, AND IT IS DERIVED FROM TWO THINGS. First,
    # the pool's own variance: the maximum is 1.56 times the minimum on identical code, and the next
    # processor may be slower than any of the three seen, so the floor is 25m23s times 1.56, which is
    # 39m31s. Second, the value is rounded up past that floor to the one a sibling file already
    # carries, exactly as a test bound is: `coverage-timeout-study.yml` runs both of its own jobs at
    # `timeout-minutes: 45`. That gives 45.
    #
    # WHAT IT PROTECTS, WHICH IS THE PART THE NUMBER IS FOR. A wall must not redden a healthy run,
    # and it must leave room for a bound inside the job to fire and say what hung, because a bound
    # converted into a job kill reports nothing. The largest bound in this job is the uncertified
    # static build trap, whose case timeout is 863,580 ms, 14m24s. On the worst observed run that
    # case cost 21 s in the integration step, so a hang there reads about 26m11s and a hang in the
    # coverage step reads about 38m27s, both inside 45 with room. At 30 neither would have reported.
    timeout-minutes: 45

    # THE FLOOR IS THE VERSION THAT MATTERS AND IS THE ONE THAT HAD NEVER BEEN TESTED. The
    # manifests promise `^22.22.2 || ^24.15.0 || >=26.0.0`, the maintainer's machine is on
    # 24.14.1, and this job used to run 24 alone. So the promise made to the reader on the
    # oldest supported runtime was carried by nothing at all.
    #
    # Both ends are here rather than the floor alone: dropping 24 to add 22 would trade one
    # blind spot for another, and a suite that only ever ran on one version is what this
    # change exists to end.
    strategy:
      fail-fast: false
      matrix:
        node: ['22.22.2', '^24.15.0']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm run format:check

      # BUILD BEFORE LINT, BECAUSE TYPED LINTING READS DECLARATION OUTPUT. `projectService`
      # picks the nearest tsconfig, and a package tsconfig carries no `paths`, so a sibling
      # `@openref/*` resolves through node_modules to `dist/*.d.ts`. On a clean checkout that
      # file does not exist yet and every expression touching a workspace type becomes an error
      # type: 954 errors that say nothing about the code. The maintainer's machine has never
      # seen this because `dist/` has been on it since the day the package was written.
      - name: Build
        run: pnpm run build

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test

      # The integration suite holds the gate tests themselves: the dependency graph boundary
      # probe, the license attestations and the corpus attribution. Without this step they
      # only ever run on a developer's machine.
      - name: Integration tests
        run: pnpm run test:integration

      - name: Gates
        run: pnpm run gates

      # A REGENERATED RECORDING MUST NOT REACH A COMMIT UNNOTICED, per the T065 section on the
      # file snapshot harness. Measured on vitest 4.1.10: a perturbed `toMatchFileSnapshot`
      # recording fails red and is not rewritten, with CI set and without it, but an ABSENT one is
      # written and the run is green when CI is unset. Nine call sites over four files carry
      # readings that way, so deleting one locally and re-running yields a pass and a modified
      # working tree, and nothing between that and a commit reads the tree. This step is that
      # reader. It runs after every suite and after the gates, so it also catches anything else
      # the run writes back into the checkout.
      - name: No suite rewrote a recorded reading
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "The working tree changed while the suites ran. A recorded reading was rewritten:"
            git status --porcelain
            git diff --stat
            exit 1
          fi

  static-build-budget:
    name: static build of 1000 nodes on a declared runner size
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # A JOB OF ITS OWN BECAUSE THE BUDGET IS ABOUT A MACHINE. SPEC 20 bounds the static build of
    # 1000 nodes on four cores at sixty seconds. Run wherever a suite happens to land, that
    # assertion measures hardware nobody declared, and T039 recorded exactly that: on the
    # maintainer's workstation the build finishes about twenty times inside the ceiling, so the
    # number was a hang catcher rather than a budget.
    #
    # THE RUNNER SIZE IS DECLARED TO THE SUITE RATHER THAN ASSUMED BY IT. The standard
    # `ubuntu-latest` runner is four vCPU, which is the size SPEC 20 states, and this job says so
    # in `OPENREF_STATIC_BUDGET_CORES`. The suite asserts the machine really has that many and
    # refuses to certify otherwise, naming both counts, so the day GitHub changes the runner is a
    # red job rather than a figure quietly taken from a different machine. `static-suites` in
    # `pnpm gates` checks this job is here and says what it must, because a deleted job would
    # otherwise turn certification off with nothing anywhere saying so.
    env:
      OPENREF_STATIC_BUDGET_CORES: '4'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '^24.15.0'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Static build elapsed budget
        run: pnpm exec vitest run packages/static/test/integration/build-budget.spec.ts

  module-floor:
    name: load on the engines floor
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # A JOB OF ITS OWN BECAUSE IT RUNS ON A DIFFERENT NODE. SPEC 23 says ERR_REQUIRE_ESM in a
    # consumer project is inadmissible, and native require(esm) arrived in Node 20.19, so the
    # verify job above passes whether or not anything was done about it. The reader this
    # protects is on an older runtime. A compatibility check that cannot fail on the version it
    # protects reports coverage that does not exist.
    #
    # The floor is pinned here and asserted against engines.node by
    # tools/gates/test/unit/module-floor.spec.ts, so the two cannot drift apart in silence.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '^24.15.0'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      # THE PREVIOUS COMMENT HERE SAID pnpm DOES NOT RUN ON THE FLOOR. IT DOES. pnpm 11.20.0
      # declares `node >=22.13`, the floor is 22.22.2, and the verify job above installs and
      # runs the entire suite there on every push. The constraint was invented and then obeyed.
      #
      # The switch happens after the build for a reason that survives the correction, and it is
      # a choice about what is under test rather than a limit: what this job protects is a
      # consumer LOADING the built package on the oldest supported runtime. Building on the
      # floor would test the toolchain instead, and the check itself is plain Node with no
      # dependencies precisely so that nothing but the artefact is in the way.
      - name: Switch to the engines floor
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2

      - name: Load the package on the floor
        run: node tools/module-floor-check.mjs
