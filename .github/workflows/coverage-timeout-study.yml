name: Coverage timeout study

# WHAT THIS IS FOR, AND WHY IT IS NOT THE COVERAGE GATE. The gate answers one question, pass or
# fail, and prints the last 4,000 characters of a failed run. That is enough to know the gate is
# red and not enough to know which cases were close to the five second default or by how much.
# This workflow answers the second question: every case's duration, on the runner, with the
# instrumentation on, across enough samples to see a spread rather than one reading.
#
# ON THE RUNNER AND NOWHERE ELSE. The failure being measured exists only where the machine is four
# vCPU and the coverage instrumentation is active. A duration taken on a workstation names a
# machine no gate runs on, so it is worth recording beside a runner figure for contrast and is
# never the basis for a bound.
#
# THE IDENTIFY JOB AND THE MEASURE JOBS ASK DIFFERENT THINGS ON PURPOSE. `identify` runs the exact
# command the coverage gate runs, with vitest's default timeout untouched, and keeps the whole
# output instead of the gate's tail: that is what names the cases that actually went red. `measure`
# raises the timeout on the command line so that the same cases run to completion and report a real
# duration, which a case killed at 5,000 ms cannot do. Neither job commits anything and neither
# moves a bound; the raise lives on the command line of a measurement run.
#
# THE PROCESSOR IS RECORDED. The runner pool hands out a processor per job and does not say which,
# and this repository has three studies on record measuring the same page on three different ones.
# A duration with no machine beside it is not a measurement.
#
# THE JOB WALL IS THE BINDING CONSTRAINT AND NOTHING HERE CHANGES IT. Measured, and reported rather
# than fixed, because raising a CI job timeout so a job passes is what CLAUDE.md rule 3 forbids and
# this is the maintainer's call. On 2026-09-03 the Node 22 verify job of `ci.yml` ran 28m55s against
# its own `timeout-minutes: 30` while absorbing exactly one 180,000 ms test timeout, which leaves 65
# seconds. Node 24 ran 23m58s in the same run. A second timeout in one job therefore kills the job
# before any bound in it can report, so every bound in the suite is capped in practice by what one
# job can absorb, not by what it declares. That is the reason a per member bound is worth more than
# a per class one here, and the reason `format-allowlist.spec.ts` cannot be given an order of
# magnitude over its own maximum: ten times its worst reading is 40.6 minutes, past the wall itself.

# AND SINCE 2026-09-04 THE WALL IS MEASURED HERE RATHER THAN ONLY DISCUSSED, because the maintainer
# ruled that it be set by the same rule as everything else, above the observed maximum, and that
# needed a reading of the whole job rather than three durations copied off three different commits.
# The `wall` job below runs the `verify` job of `ci.yml` step for step and times it. The one
# difference is `continue-on-error` on the steps that can fail, and it exists because a job that
# stops at its seventh step reports the duration of seven steps: on 2026-09-04 the Node 24 verify job
# stopped in `Integration tests` at 9m48s on a budget four bytes over, and the `Gates` step, which is
# the most expensive one in the job, was skipped. A wall derived from that number would be a wall
# derived from a truncated run. Nothing is skipped and no assertion is weakened; a failure is
# recorded and the run keeps going so the clock reaches the end.

# THE PATH FILTER IS WHAT KEEPS THIS FROM BEING A TAX ON ORDINARY WORK. Twelve instrumented
# coverage runs is about three hours of runner time, and none of it is caused by a commit to the
# product: the study re-runs when the study itself changes, and `workflow_dispatch` is here for the
# day this file is on the default branch, exactly as `page-language-bytes.yml` explains.
on:
  push:
    branches: ['coverage-timeouts/**', 'page-bytes/**']
    paths: ['.github/workflows/coverage-timeout-study.yml']
  workflow_dispatch:

jobs:
  identify:
    name: red set, sample ${{ matrix.sample }} on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # SAMPLED RATHER THAN RUN ONCE, BECAUSE THE ANSWER MOVES. F25 recorded the red set moving
    # between runs on one machine, and it moved again here: the coverage gate reported seven cases
    # on 2026-09-03 and the first run of this job reported three. One run names a sample of the
    # population, and the population is what a bound has to cover, so the union across samples is
    # the reading and a single run is not.
    strategy:
      fail-fast: false
      matrix:
        node: ['22.22.2', '^24.15.0']
        sample: [1, 2, 3]
        include:
          - node: '22.22.2'
            label: '22'
          - node: '^24.15.0'
            label: '24'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Report the machine
        run: |
          echo "nproc $(nproc)"
          grep -m1 'model name' /proc/cpuinfo || true
          echo "image ${ImageOS:-unknown} version ${ImageVersion:-unknown} arch ${RUNNER_ARCH:-unknown}"
          node --version

      # The gate's own command, with the default timeout untouched, so the set of red cases is the
      # set the gate would report. `|| true` keeps the log, which is the thing being collected.
      - name: The coverage gate's command, whole output kept
        run: |
          set -o pipefail
          pnpm exec vitest run --coverage --reporter=default 2>&1 | tee coverage-default-timeout.log || true

      - name: Upload the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: red-set-node${{ matrix.label }}-sample${{ matrix.sample }}
          path: coverage-default-timeout.log

  measure:
    name: durations, sample ${{ matrix.sample }} on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # BOTH NODE VERSIONS, BECAUSE THE GATE RUNS ON BOTH. The verify job carries the coverage gate
    # on the engines floor and on the current major, so a bound derived from one of them would be
    # derived from half the runs it has to survive.
    #
    # `fail-fast: false` because a sample that goes over is the reading, not a reason to throw away
    # the other samples.
    #
    # SIX SAMPLES PER ROUND, AND EVERY ARTIFACT OF THE ROUND IS READ. The first derivation ran this
    # job twice, three samples and then two, and read six artifacts from the first run and four from
    # the second while calling the total nine. The sample it dropped, `durations-node22-sample3`,
    # was the one carrying every maximum, so every bound came out low and the margin the files
    # claimed did not hold. One round with one artifact naming convention is harder to miscount, and
    # the count is now checked in the files themselves rather than stated in their comments.
    strategy:
      fail-fast: false
      matrix:
        node: ['22.22.2', '^24.15.0']
        sample: [1, 2, 3]
        include:
          - node: '22.22.2'
            label: '22'
          - node: '^24.15.0'
            label: '24'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Report the machine
        run: |
          echo "nproc $(nproc)"
          grep -m1 'model name' /proc/cpuinfo || true
          echo "image ${ImageOS:-unknown} version ${ImageVersion:-unknown} arch ${RUNNER_ARCH:-unknown}"
          node --version

      # THE TIMEOUT IS RAISED HERE AND NOWHERE ELSE. A case killed at 5,000 ms reports 5,000 ms,
      # which is the instrument's number and not the case's, so the measurement needs the cases to
      # finish. This is a command line argument on a measurement run: no committed default moves.
      - name: Coverage run with durations
        run: |
          set -o pipefail
          pnpm exec vitest run --coverage --testTimeout=180000 --hookTimeout=180000 \
            --reporter=default --reporter=json --outputFile.json=durations.json 2>&1 \
            | tee coverage-raised-timeout.log || true

      - name: Upload the durations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: durations-node${{ matrix.label }}-sample${{ matrix.sample }}
          path: |
            durations.json
            coverage-raised-timeout.log

  wall:
    name: whole job, sample ${{ matrix.sample }} on Node ${{ matrix.node }}
    runs-on: ubuntu-latest

    # THE CEILING HERE IS THE INSTRUMENT AND NOT THE SUBJECT, which is why it is nowhere near the
    # wall it is measuring. A study whose own timeout can fire returns the study's number instead of
    # the job's, exactly as a case killed at 5,000 ms reports 5,000 ms. Sixty is far above anything
    # `verify` has ever read and its only job is to stop a hung sample from burning an hour.
    timeout-minutes: 60

    # BOTH NODE VERSIONS AND THREE SAMPLES, BECAUSE THE THING BEING MEASURED IS VARIANCE. The same
    # code has read 21m32s, 28m13s and 28m55s on this runner pool, which is 6m41s of spread with
    # nothing changed, so one reading names a sample and not the population. `fail-fast: false`
    # because a slow sample is the reading.
    strategy:
      fail-fast: false
      matrix:
        node: ['22.22.2', '^24.15.0']
        sample: [1, 2, 3]

    steps:
      - name: Report the machine
        run: |
          echo "nproc $(nproc)"
          grep -m1 'model name' /proc/cpuinfo || true
          echo "image ${ImageOS:-unknown} version ${ImageVersion:-unknown} arch ${RUNNER_ARCH:-unknown}"

      # FROM HERE DOWN THIS IS THE `verify` JOB OF `ci.yml`, STEP FOR STEP AND IN ITS ORDER, because
      # a wall is a property of that job and a rearranged copy would be measuring something else.
      # The only edit is `continue-on-error` on the four steps that can fail, so the clock reaches
      # the end of the job even when one of them is red. Nothing is skipped and no assertion moves.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format check
        continue-on-error: true
        run: pnpm run format:check

      - name: Build
        run: pnpm run build

      - name: Lint
        continue-on-error: true
        run: pnpm run lint

      - name: Test
        continue-on-error: true
        run: pnpm run test

      - name: Integration tests
        continue-on-error: true
        run: pnpm run test:integration

      - name: Gates
        continue-on-error: true
        run: pnpm run gates

      - name: No suite rewrote a recorded reading
        continue-on-error: true
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "The working tree changed while the suites ran. A recorded reading was rewritten:"
            git status --porcelain
            git diff --stat
            exit 1
          fi
