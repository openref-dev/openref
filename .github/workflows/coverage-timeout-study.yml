name: Coverage timeout study

# WHAT THIS IS FOR, AND WHY IT IS NOT THE COVERAGE GATE. The gate answers one question, pass or
# fail, and prints the last 4,000 characters of a failed run. That is enough to know the gate is
# red and not enough to know which cases were close to the five second default or by how much.
# This workflow answers the second question: every case's duration, on the runner, with the
# instrumentation on, across enough samples to see a spread rather than one reading.
#
# ON THE RUNNER AND NOWHERE ELSE. The failure being measured exists only where the machine is four
# vCPU and the coverage instrumentation is active. A duration taken on a workstation names a
# machine no gate runs on, so it is worth recording beside a runner figure for contrast and is
# never the basis for a bound.
#
# THE IDENTIFY JOB AND THE MEASURE JOBS ASK DIFFERENT THINGS ON PURPOSE. `identify` runs the exact
# command the coverage gate runs, with vitest's default timeout untouched, and keeps the whole
# output instead of the gate's tail: that is what names the cases that actually went red. `measure`
# raises the timeout on the command line so that the same cases run to completion and report a real
# duration, which a case killed at 5,000 ms cannot do. Neither job commits anything and neither
# moves a bound; the raise lives on the command line of a measurement run.
#
# THE PROCESSOR IS RECORDED. The runner pool hands out a processor per job and does not say which,
# and this repository has three studies on record measuring the same page on three different ones.
# A duration with no machine beside it is not a measurement.

on:
  push:
    branches: ['coverage-timeouts/**']
  workflow_dispatch:

jobs:
  identify:
    name: red set, sample ${{ matrix.sample }} on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # SAMPLED RATHER THAN RUN ONCE, BECAUSE THE ANSWER MOVES. F25 recorded the red set moving
    # between runs on one machine, and it moved again here: the coverage gate reported seven cases
    # on 2026-09-03 and the first run of this job reported three. One run names a sample of the
    # population, and the population is what a bound has to cover, so the union across samples is
    # the reading and a single run is not.
    strategy:
      fail-fast: false
      matrix:
        node: ['22.22.2', '^24.15.0']
        sample: [1, 2, 3]
        include:
          - node: '22.22.2'
            label: '22'
          - node: '^24.15.0'
            label: '24'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Report the machine
        run: |
          echo "nproc $(nproc)"
          grep -m1 'model name' /proc/cpuinfo || true
          echo "image ${ImageOS:-unknown} version ${ImageVersion:-unknown} arch ${RUNNER_ARCH:-unknown}"
          node --version

      # The gate's own command, with the default timeout untouched, so the set of red cases is the
      # set the gate would report. `|| true` keeps the log, which is the thing being collected.
      - name: The coverage gate's command, whole output kept
        run: |
          set -o pipefail
          pnpm exec vitest run --coverage --reporter=default 2>&1 | tee coverage-default-timeout.log || true

      - name: Upload the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: red-set-node${{ matrix.label }}-sample${{ matrix.sample }}
          path: coverage-default-timeout.log

  measure:
    name: durations, sample ${{ matrix.sample }} on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # BOTH NODE VERSIONS, BECAUSE THE GATE RUNS ON BOTH. The verify job carries the coverage gate
    # on the engines floor and on the current major, so a bound derived from one of them would be
    # derived from half the runs it has to survive.
    #
    # `fail-fast: false` because a sample that goes over is the reading, not a reason to throw away
    # the other samples.
    strategy:
      fail-fast: false
      matrix:
        node: ['22.22.2', '^24.15.0']
        sample: [4, 5]
        include:
          - node: '22.22.2'
            label: '22'
          - node: '^24.15.0'
            label: '24'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Report the machine
        run: |
          echo "nproc $(nproc)"
          grep -m1 'model name' /proc/cpuinfo || true
          echo "image ${ImageOS:-unknown} version ${ImageVersion:-unknown} arch ${RUNNER_ARCH:-unknown}"
          node --version

      # THE TIMEOUT IS RAISED HERE AND NOWHERE ELSE. A case killed at 5,000 ms reports 5,000 ms,
      # which is the instrument's number and not the case's, so the measurement needs the cases to
      # finish. This is a command line argument on a measurement run: no committed default moves.
      - name: Coverage run with durations
        run: |
          set -o pipefail
          pnpm exec vitest run --coverage --testTimeout=180000 --hookTimeout=180000 \
            --reporter=default --reporter=json --outputFile.json=durations.json 2>&1 \
            | tee coverage-raised-timeout.log || true

      - name: Upload the durations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: durations-node${{ matrix.label }}-sample${{ matrix.sample }}
          path: |
            durations.json
            coverage-raised-timeout.log
