name: Browser budget study

# THE FIRST FIGURE HAS TO COME FROM THE RUNNER, NOT FROM A WORKSTATION.
#
# `Emulation.setCPUThrottlingRate` is relative to the host CPU, so a 4x throttle on a
# developer machine and a 4x throttle here are two different measurements. A baseline taken
# locally would name a machine nobody will ever run again.
#
# This is also the mechanism the T015 amendment asks for: when the runner image ships a new
# Chrome major, the relative check stops firing and the committed baseline has to be
# re-recorded deliberately. Re-recording is dispatching this workflow and reading the summary,
# which is one deliberate act rather than a silent reset.
#
# THE IMAGE IS PINNED. `ubuntu-latest` moves, and a budget measured on an image that moves is
# not a budget. When this pin is raised, the baseline is re-recorded in the same commit.

on:
  # THE `budget-study/**` PUSH TRIGGER IS GONE BECAUSE THE CONDITION THAT NEEDED IT IS GONE.
  # It existed for one reason: `workflow_dispatch` and `schedule` only exist once the file is
  # on the default branch, and the default branch was an unrelated initial commit that no work
  # descended from, so the very first study, the one that set the first baseline, could not be
  # dispatched. A reserved branch prefix was the only way to run a study before main was real.
  # Main is now the work, and both triggers below are available, so the prefix names nothing.
  #
  # ONE CORRECTION RECORDED HERE RATHER THAN LEFT AS FOLKLORE: this study was described as a
  # 45 minute cost on every push. Neither half held. The 45 is `timeout-minutes`, a hang
  # catcher, and the studies it bounds run in about 1m45s; and the trigger was scoped to a
  # branch prefix, so it never fired on ordinary work and was never gating it.
  #
  # THE SCHEDULE IS THE PART THAT ADDS COVER. Nothing in this study is caused by a commit. It
  # drifts when the runner pool hands out a different processor, when the image bumps, or when
  # Chrome ships a major, and none of those events is a push. Weekly is chosen against the
  # decay of the check rather than against cost: a browser major that moves prints as a stale
  # baseline and does not fail, so the only thing that finds it is a run that happens anyway.
  #
  # IF THIS EVER SITS RED, IT COMES OFF THE SCHEDULE. It is not muted, not marked
  # `continue-on-error`, and not left failing while everyone learns to ignore it. Decided when
  # the schedule was added and written here on 2026-08-11, because this file is where somebody
  # looking at a red weekly run will be. A scheduled job that is always red is worse than one
  # that does not exist: it trains a reader to skip the one notification that would have told
  # them the baseline had gone stale, and it does that quietly. Taking it off the schedule
  # leaves `workflow_dispatch`, so the study is still one command away while whatever made it
  # red is fixed.
  workflow_dispatch:
    inputs:
      tti-runs:
        description: Throttled runs over the thousand node page
        required: false
        default: '20'
      memory-runs:
        description: Unthrottled runs over the 6.4 MB document
        required: false
        default: '5'
  schedule:
    # Mondays 04:00 UTC. A scheduled run carries no inputs, which is why the step below keeps
    # its fallbacks rather than relying on the defaults declared above.
    - cron: '0 4 * * 1'

jobs:
  study:
    name: study ${{ matrix.sample }}, TTI and the work behind it
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    # THREE INDEPENDENT STUDIES PER RUN, BECAUSE THE POOL IS WHAT IS BEING SAMPLED.
    #
    # The runner pool hands out a processor per job and does not say which. Three studies taken
    # across three sessions measured 213.9, 148.2 and 196.0 ms on an EPYC 9V74, an EPYC 9V45 and
    # a Xeon 8370C, all under the same image, the same Chrome and the same measured throttle, and
    # nothing in the environment id distinguished them. SPEC 20 now derives its thresholds from
    # the spread across processors rather than from one machine, so the harness has to be able to
    # see more than one machine in one push instead of waiting for luck across sessions.
    #
    # `fail-fast: false` because a study that is over its ceiling is the expected state today and
    # cancelling the other two would throw away the comparison this exists to make.
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2, 3]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      # Recorded in the log as well as in the report, because the log is what a maintainer
      # reads when a figure moves and the first question is always which browser it was.
      - name: Report the browser
        run: |
          google-chrome --version
          echo "image ${ImageOS:-unknown} version ${ImageVersion:-unknown} arch ${RUNNER_ARCH:-unknown}"

      # The fallbacks are for the schedule, which carries no inputs. `inputs.tti-runs` is the
      # empty string on a scheduled run, not the declared default, so the default has to be
      # written twice or the study silently measures zero navigations.
      #
      # `--check` is what makes this a gate rather than a report: the study compares what it
      # just measured against `tools/browser-budget/baseline.json`, fails on a SPEC 20 ceiling
      # always, and fails on a jump beyond the recorded spread while the browser major is
      # unchanged. A browser major that moved is printed as a stale baseline and does not fail,
      # because an image bump is not a regression and a check that fires on one gets ignored.
      #
      # THIS JOB IS RED WHILE TTI IS OVER ITS CEILING, deliberately, in the same way the
      # `module-floor` job was red for one commit when the claim it checked was false. The
      # report is uploaded before the check runs, so a red run still hands over its numbers.
      - name: Study
        run: >
          node tools/browser-budget/dist/cli.js
          --tti-runs=${{ inputs.tti-runs || '25' }}
          --memory-runs=${{ inputs.memory-runs || '5' }}
          --out=browser-budget-study.json
          --check

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-budget-study-${{ matrix.sample }}
          path: browser-budget-study.json
