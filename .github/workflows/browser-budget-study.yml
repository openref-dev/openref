name: Browser budget study

# THE FIRST FIGURE HAS TO COME FROM THE RUNNER, NOT FROM A WORKSTATION.
#
# `Emulation.setCPUThrottlingRate` is relative to the host CPU, so a 4x throttle on a
# developer machine and a 4x throttle here are two different measurements. A baseline taken
# locally would name a machine nobody will ever run again.
#
# This is also the mechanism the T015 amendment asks for: when the runner image ships a new
# Chrome major, the relative check stops firing and the committed baseline has to be
# re-recorded deliberately. Re-recording is dispatching this workflow and reading the summary,
# which is one deliberate act rather than a silent reset.
#
# THE IMAGE IS PINNED. `ubuntu-latest` moves, and a budget measured on an image that moves is
# not a budget. When this pin is raised, the baseline is re-recorded in the same commit.

on:
  # TWO TRIGGERS, AND THE SECOND IS NOT REDUNDANT. `workflow_dispatch` only exists once the
  # file is on the default branch, so the very first study, the one that sets the first
  # baseline, cannot use it. A branch prefix reserved for the purpose is what makes a study
  # runnable before it has ever been merged, and it stays useful afterwards for a study that
  # has to run against a change that is not on main yet.
  push:
    branches: ['budget-study/**']
  workflow_dispatch:
    inputs:
      tti-runs:
        description: Throttled runs over the thousand node page
        required: false
        default: '20'
      memory-runs:
        description: Unthrottled runs over the 6.4 MB document
        required: false
        default: '5'

jobs:
  study:
    name: study ${{ matrix.sample }}, TTI and the work behind it
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    # THREE INDEPENDENT STUDIES PER PUSH, BECAUSE THE POOL IS WHAT IS BEING SAMPLED.
    #
    # The runner pool hands out a processor per job and does not say which. Three studies taken
    # across three sessions measured 213.9, 148.2 and 196.0 ms on an EPYC 9V74, an EPYC 9V45 and
    # a Xeon 8370C, all under the same image, the same Chrome and the same measured throttle, and
    # nothing in the environment id distinguished them. SPEC 20 now derives its thresholds from
    # the spread across processors rather than from one machine, so the harness has to be able to
    # see more than one machine in one push instead of waiting for luck across sessions.
    #
    # `fail-fast: false` because a study that is over its ceiling is the expected state today and
    # cancelling the other two would throw away the comparison this exists to make.
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2, 3]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      # Recorded in the log as well as in the report, because the log is what a maintainer
      # reads when a figure moves and the first question is always which browser it was.
      - name: Report the browser
        run: |
          google-chrome --version
          echo "image ${ImageOS:-unknown} version ${ImageVersion:-unknown} arch ${RUNNER_ARCH:-unknown}"

      # The fallbacks are for the push trigger, which carries no inputs.
      #
      # `--check` is what makes this a gate rather than a report: the study compares what it
      # just measured against `tools/browser-budget/baseline.json`, fails on a SPEC 20 ceiling
      # always, and fails on a jump beyond the recorded spread while the browser major is
      # unchanged. A browser major that moved is printed as a stale baseline and does not fail,
      # because an image bump is not a regression and a check that fires on one gets ignored.
      #
      # THIS JOB IS RED WHILE TTI IS OVER ITS CEILING, deliberately, in the same way the
      # `module-floor` job was red for one commit when the claim it checked was false. The
      # report is uploaded before the check runs, so a red run still hands over its numbers.
      - name: Study
        run: >
          node tools/browser-budget/dist/cli.js
          --tti-runs=${{ inputs.tti-runs || '25' }}
          --memory-runs=${{ inputs.memory-runs || '5' }}
          --out=browser-budget-study.json
          --check

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-budget-study-${{ matrix.sample }}
          path: browser-budget-study.json
